{% extends 'base.html' %}

{% block title %}Eliminar Publicación - ChangaMas{% endblock %}

{% block content %}
    <h1>Eliminar Publicación</h1>

    <p>¿Estás seguro de que deseas eliminar la publicación "<strong>{{ object.titulo }}</strong>"? Esta acción no se puede deshacer.</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" style="background-color: #dc3545; color: white; border: none; padding: 10px 15px; cursor: pointer;">
            Sí, Eliminar
        </button>
        <a href="{% url 'publicaciones:detalle' object.pk %}" style="margin-left: 10px;">Cancelar</a>
    </form>
{% endblock %}
