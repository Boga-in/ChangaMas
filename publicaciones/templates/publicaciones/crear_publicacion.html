{% extends 'base.html' %}

{% block title %}Crear Publicación - ChangaMas{% endblock %}

{% block content %}
    <h1>Crear una nueva publicación</h1>
    
    <!-- enctype="multipart/form-data" es obligatorio para subir imágenes o archivos -->
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <!-- Las CBV pasan el formulario a la plantilla bajo el nombre 'form' -->
        {{ form.as_p }}
        
        <button type="submit">Guardar Publicación</button>
        <a href="{% url 'publicaciones:lista' %}">Cancelar</a>
    </form>
{% endblock %}
