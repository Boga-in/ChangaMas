<!-- HEADER GLOBAL / NAV-BAR -->
    <header style="background-color: #2c3e50; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;">
        
        <!-- LOGO / TÍTULO -->
        <div style="font-size: 24px; font-weight: bold;">
            <a href="{% url 'inicio' %}" style="color: white; text-decoration: none;">ChangaMas</a>
        </div>

        <!-- NAVEGACIÓN CENTRAL -->
        <nav>
            <a href="{% url 'inicio' %}" style="color: white; text-decoration: none; margin-right: 20px;">Inicio</a>
            {% if user.is_authenticated %}
                <a href="{% url 'usuario_detalle' user.pk %}" style="color: white; text-decoration: none; margin-right: 20px;">Perfil</a> 
            {% endif %}
            {% if user.is_authenticated and user.is_staff %}
                <a href="{% url 'listar_publicaciones' %}" style="color: white; text-decoration: none; margin-right: 20px;">Publicaciones</a>
                <a href="{% url 'usuario_lista' %}" style="color: white; text-decoration: none; margin-right: 20px;">Usuarios</a>
            {% endif %}
        </nav>

        <!-- ZONA DE USUARIO (El espacio para un futuro Login/Registro) -->
        <div>
            {% if user.is_authenticated %}
                <span style="color: #1abc9c; margin-right: 15px;">Hola, {{ user.username }}</span>
                <!-- Aquí irá el botón de Cerrar Sesión después -->
            {% else %}
                <!-- Aquí irán los futuros botones de Login y Registro -->
                <span style="color: #bdc3c7; font-style: italic;">(Futuro Login / Registro)</span>
            {% endif %}
        </div>
        
    </header>
