<header class="main-header">
    <div class="brand-logo">
        <a href="{% url 'inicio' %}">ChangaMas</a>
    </div>

    <nav class="nav-links">
        <a href="{% url 'inicio' %}">Inicio</a>
        <a href="{% url 'publicaciones:crear' %}">Perfil</a> 
    </nav>

    <div class="user-zone">
        {% if user.is_authenticated %}
            <span class="user-name">Hola, {{ user.username }}</span>
            <form action="{% url 'admin:logout' %}" method="POST" style="display: inline;">
                {% csrf_token %}
                <button type="submit" class="btn-link-danger">Cerrar Sesión</button>
            </form>
        {% else %}
            <span class="user-muted">(Futuro Login / Registro)</span>
        {% endif %}
    </div>
</header>
