<header class="main-header">
    <div class="brand-logo">
        <a href="{% url 'publicaciones:inicio' %}">ChangaMas</a>
    </div>

        <!-- NAVEGACIÓN CENTRAL -->
        <nav>
            {% if user.is_authenticated %}
                <a href="{% url 'usuario_detalle' user.pk %}" style="color: white; text-decoration: none; margin-right: 20px;">Perfil</a> 
            {% endif %}
            {% if user.is_authenticated and user.is_staff %}
                <a href="{% url 'usuario_lista' %}" style="color: white; text-decoration: none; margin-right: 20px;">Usuarios</a>
                <a href="{% url 'publicaciones:lista' %}" style="color: white; text-decoration: none; margin-right: 20px;">Publicaciones</a>
            {% endif %}
        </nav>

        <!-- ZONA DE USUARIO -->
        <div>
            {% if user.is_authenticated %}
                <span style="color: #1abc9c; margin-right: 15px; font-weight: bold;">Hola, {{ user.username }}</span>
        
                <!-- EL NUEVO BOTÓN SEGURO DE LOGOUT -->
                <form method="post" action="{% url 'logout' %}" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-danger btn-sm">Cerrar Sesión</button>
                </form>
            {% else %}
                <!-- Botones para visitantes -->
        <a href="{% url 'login' %}" class="btn btn-outline-light me-2">Iniciar Sesión</a>
        <a href="{% url 'usuario_crear' %}" class="btn btn-warning">Regístrate</a>
    {% endif %}
</div>
        
    </header>
